# Resolution width
WIDTH=640

# Resolution height
HEIGHT=480

# Frames per second
FPS=15

# Number of V4L2 capture buffers to request.
# If video stutters, try increasing this value for smoother capture.
# More buffers use more memory.
# Restart the camera after changing this value.
BUFFERS=1

# Video device: 'auto' or video<N> (like video0)
VIDEO=auto

# Reduce camera memory usage
# Some cameras use as much memory at 640x480 as they would for a 1080p stream.
# Set to 1 to limit that buffer, or to 0 if the camera does not work properly with it.
REDUCE_MEMORY=0

# Image post-processing settings.
# Enable this to use image post-processing
POST_PROCESSING=1

# Preview and tune these settings at:
# http://printer_ip:8080/control.htm
# Changes apply to the running camera automatically.
# "Save" updates this file and keeps the values after a restart.
# You can also edit the values below manually and run CAMERA_RELOAD.

# E_BRIGHTNESS=0
# E_CONTRAST=35
# E_GAIN=1
# E_GAMMA=100
# E_HUE=300
# E_SATURATION=42  
# E_SHARPNESS=7
# E_POWER_LINE_FREQUENCY=0
