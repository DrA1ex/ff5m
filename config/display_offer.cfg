# The hidden flag is presentation state only.  Display switching still goes
# through the normal SET_MOD change hook and its existing safety/restart path.
[delayed_gcode _FEATHER_PROMO_STARTUP]
initial_duration: 8
gcode:
    {% set pending = printer.mod_params.variables.show_feather_promo %}
    {% set display = printer.mod_params.variables.display %}
    {% if pending and display == 1 %}
        # Existing Feather users have already made their display choice.
        SET_MOD PARAM=show_feather_promo VALUE=0
    {% elif pending %}
        {% set stats_state = printer.print_stats.state|string|lower %}
        {% set sd_active = printer.virtual_sdcard.is_active %}
        {% set print_active = printer["gcode_macro _START_PRINT"].print_active %}
        {% set printing = printer.idle_timeout.state == "Printing" %}
        {% set resurrection = printer['resurrection']|default({}) %}
        {% set recovery_available = resurrection.available|default(false) %}
        {% set busy = printing or stats_state in ["printing", "paused"]
            or sd_active or print_active or recovery_available %}
        {% if not busy %}
            RESPOND TYPE=command MSG="action:prompt_begin Try the new Feather screen"
            RESPOND TYPE=command MSG="action:prompt_text Feather now provides local print control, filament workflows, calibration, network setup, settings, and themes."
            RESPOND TYPE=command MSG="action:prompt_text Switching display mode restarts Klipper. You can switch back later from Feather Settings."
            RESPOND TYPE=command MSG="action:prompt_footer_button Try Feather|_FEATHER_PROMO_ACCEPT|primary"
            RESPOND TYPE=command MSG="action:prompt_footer_button Later|RESPOND TYPE=command MSG=action:prompt_end|secondary"
            RESPOND TYPE=command MSG="action:prompt_footer_button Never show again|_FEATHER_PROMO_DISMISS|warning"
            RESPOND TYPE=command MSG="action:prompt_show"
        {% endif %}
    {% endif %}

[gcode_macro _FEATHER_PROMO_ACCEPT]
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    {% set pending = printer.mod_params.variables.show_feather_promo %}
    {% set display = printer.mod_params.variables.display %}
    {% set stats_state = printer.print_stats.state|string|lower %}
    {% set sd_active = printer.virtual_sdcard.is_active %}
    {% set print_active = printer["gcode_macro _START_PRINT"].print_active %}
    {% set printing = printer.idle_timeout.state == "Printing" %}
    {% set resurrection = printer['resurrection']|default({}) %}
    {% set recovery_available = resurrection.available|default(false) %}
    {% set busy = printing or stats_state in ["printing", "paused"]
        or sd_active or print_active or recovery_available %}
    {% if pending and display != 1 and not busy %}
        SET_MOD PARAM=show_feather_promo VALUE=0
        SET_MOD PARAM=display VALUE=FEATHER
    {% elif pending and display != 1 %}
        RESPOND TYPE=command MSG="action:prompt_begin Feather switch unavailable"
        RESPOND TYPE=command MSG="action:prompt_text Wait until printing or recovery is finished. The offer will return after the next Klipper startup."
        RESPOND TYPE=command MSG="action:prompt_footer_button Later|RESPOND TYPE=command MSG=action:prompt_end|secondary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Never show again|_FEATHER_PROMO_DISMISS|warning"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% elif pending %}
        SET_MOD PARAM=show_feather_promo VALUE=0
    {% endif %}

[gcode_macro _FEATHER_PROMO_DISMISS]
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    {% if printer.mod_params.variables.show_feather_promo %}
        SET_MOD PARAM=show_feather_promo VALUE=0
    {% endif %}
