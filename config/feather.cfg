[include ../macros/base.cfg]
[include ../macros/headless.cfg]
[include ../macros/client.cfg]

[gcode_macro THEME_EDITOR]
description: Start Theme Editor on the local network
gcode:
    RESPOND PREFIX="//" MSG="Starting Theme Editor. Its local network URL will appear below."
    RESPOND PREFIX="//" MSG="Run _STOP_TM_EDITOR to stop it."
    RUN_SHELL_COMMAND CMD=theme_editor PARAMS=start

[gcode_macro _STOP_TM_EDITOR]
description: Stop Theme Editor
gcode:
    RUN_SHELL_COMMAND CMD=theme_editor PARAMS=stop

[gcode_macro _APPLY_TM_EDITOR_THEME]
description: Apply a Theme Editor theme while the printer is idle
gcode:
    {% set theme = params.THEME|string|upper %}
    {% set print_state = printer.print_stats.state|string|lower %}
    {% set sd_active = printer.virtual_sdcard.is_active %}
    {% if not theme %}
        {action_raise_error("Theme name is required.")}
    {% elif print_state in ["printing", "paused"] or sd_active %}
        {action_raise_error("A theme cannot be applied while printing.")}
    {% else %}
        SET_MOD PARAM=feather_theme VALUE="{theme}"
        _REFRESH_FEATHER_THEME
    {% endif %}

[feather_screen]
# Optional overrides are intentionally commented out. Defaults live in the
# plugin, which keeps config upgrades compatible with an already-running
# Klipper process that may still have the previous plugin module cached.
# blending: True
# dim_timeout: 60
# print_history_path: /opt/config/mod_data/feather_print_history.json
# z_offset_limit: 2.0
# z_adjust_warning_threshold: 0.3
# Joystick coordinates use the Feather/MOVE_SAFE coordinate system. Z is also
# limited by the actual ToolHead Z range.
raster_acceleration: neon  # scalar (default) or neon
joystick_x_min: -110
joystick_x_max: 110
joystick_y_min: -110
joystick_y_max: 110
joystick_z_min: 0
joystick_z_max: 220
