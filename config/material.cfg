[gcode_macro _MATERIAL_CONFIG]
# These ordered lists are the only listing and enable mechanism. User
# overrides may replace either list and any individual slot variable.
variable_heating_slots: [1, 2, 3, 4, 5]
variable_cold_pull_slots: [1, 2, 3, 6]

variable_material_1: 'PLA'
variable_material_2: 'PETG'
variable_material_3: 'ABS'
variable_material_4: 'ABS-PC'
variable_material_5: 'TPU'
variable_material_6: 'NYLON'

variable_material_1_heating: {'nozzle': 220, 'bed': 60}
variable_material_2_heating: {'nozzle': 250, 'bed': 70}
variable_material_3_heating: {'nozzle': 260, 'bed': 85}
variable_material_4_heating: {'nozzle': 270, 'bed': 105}
variable_material_5_heating: {'nozzle': 220, 'bed': 50}

variable_material_1_cold_pull: {'hot': 220, 'cold': 100}
variable_material_2_cold_pull: {'hot': 250, 'cold': 100}
variable_material_3_cold_pull: {'hot': 260, 'cold': 105}
variable_material_6_cold_pull: {'hot': 265, 'cold': 120}

gcode:
    {action_respond_info("Material profiles are configuration-only")}


[gcode_macro _VALIDATE_MATERIAL_CONFIG]
gcode:
    {% set workflow = params.WORKFLOW|default("heating")|string|lower %}
    {% if workflow not in ("heating", "cold_pull") %}
        {action_raise_error("Unknown material workflow: " ~ workflow)}
    {% endif %}
    {% set config = printer["gcode_macro _MATERIAL_CONFIG"] %}
    {% set slots = config[workflow ~ "_slots"] %}
    {% if slots is not sequence or slots is string or slots|length > 5 %}
        {action_raise_error(workflow ~ "_slots must contain 0 to 5 slots")}
    {% endif %}
    {% set seen_slots = [] %}
    {% set seen_names = [] %}
    {% set allowed = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-" %}
    {% for slot in slots %}
        {% if slot is not number or slot|int != slot or slot|int <= 0 %}
            {action_raise_error(workflow ~ "_slots must contain positive integers")}
        {% endif %}
        {% if slot in seen_slots %}
            {action_raise_error(workflow ~ "_slots contains duplicate slot " ~ slot)}
        {% endif %}
        {% set _ = seen_slots.append(slot) %}
        {% set name_key = "material_" ~ slot %}
        {% set profile_key = name_key ~ "_" ~ workflow %}
        {% if config[name_key] is undefined %}
            {action_raise_error("Active material slot is missing " ~ name_key)}
        {% endif %}
        {% set name = config[name_key] %}
        {% set invalid_chars = [] %}
        {% for char in name %}
            {% if char not in allowed %}
                {% set _ = invalid_chars.append(char) %}
            {% endif %}
        {% endfor %}
        {% if name != name|upper or name == "n/a" or name|length == 0
              or name[0] == "-" or name[-1] == "-" or "--" in name
              or invalid_chars|length %}
            {action_raise_error(name_key ~ " has an invalid material name")}
        {% endif %}
        {% if name in seen_names %}
            {action_raise_error(workflow ~ " has duplicate material name " ~ name)}
        {% endif %}
        {% set _ = seen_names.append(name) %}
        {% if config[profile_key] is undefined %}
            {action_raise_error("Active material slot is missing " ~ profile_key)}
        {% endif %}
        {% set profile = config[profile_key] %}
        {% if workflow == "heating" %}
            {% if profile.nozzle is undefined or profile.bed is undefined
                  or profile.nozzle is not number or profile.bed is not number %}
                {action_raise_error(profile_key ~ " requires numeric nozzle and bed")}
            {% endif %}
            {% if profile.nozzle < printer.configfile.settings.extruder.min_temp
                  or profile.nozzle > printer.configfile.settings.extruder.max_temp
                  or profile.bed < printer.configfile.settings.heater_bed.min_temp
                  or profile.bed > printer.configfile.settings.heater_bed.max_temp %}
                {action_raise_error(profile_key ~ " exceeds heater limits")}
            {% endif %}
        {% else %}
            {% if profile.hot is undefined or profile.cold is undefined
                  or profile.hot is not number or profile.cold is not number %}
                {action_raise_error(profile_key ~ " requires numeric hot and cold")}
            {% endif %}
            {% if profile.hot <= profile.cold
                  or profile.hot < printer.configfile.settings.extruder.min_extrude_temp
                  or profile.hot > printer.configfile.settings.extruder.max_temp
                  or profile.cold < printer.configfile.settings.extruder.min_temp
                  or profile.cold > printer.configfile.settings.extruder.max_temp %}
                {action_raise_error(profile_key ~ " has invalid cold-pull temperatures")}
            {% endif %}
        {% endif %}
    {% endfor %}


[gcode_macro SET_MATERIAL]
description: Store the material currently loaded in the printer
gcode:
    {% set requested = params.MATERIAL|default("n/a")|string|upper|replace("/", "-") %}
    {% set material = "n/a" if requested in ("N/A", "NONE", "UNKNOWN") else requested %}
    {% set config = printer["gcode_macro _MATERIAL_CONFIG"] %}
    {% set active = [] %}
    {% for slot in config.heating_slots %}
        {% set _ = active.append(config["material_" ~ slot]) %}
    {% endfor %}
    {% if material != "n/a" and material not in active %}
        {action_raise_error("Unknown or inactive heating material: " ~ requested)}
    {% endif %}
    _VALIDATE_MATERIAL_CONFIG WORKFLOW=heating
    SET_MOD PARAM=current_material VALUE="{material}"
    RESPOND PREFIX="info" MSG="Current material: {material}"


[gcode_macro PREHEAT_MATERIAL]
description: Heat the printer for a material and remember the selection
gcode:
    {% set config = printer["gcode_macro _MATERIAL_CONFIG"] %}
    {% if config.heating_slots|length == 0 %}
        {action_raise_error("No heating materials are enabled")}
    {% endif %}
    {% set fallback = config["material_" ~ config.heating_slots[0]] %}
    {% set material = params.MATERIAL|default(fallback)|string|upper|replace("/", "-") %}
    {% set matches = [] %}
    {% for slot in config.heating_slots %}
        {% if config["material_" ~ slot] == material %}
            {% set _ = matches.append(slot) %}
        {% endif %}
    {% endfor %}
    {% if matches|length != 1 %}
        {action_raise_error("Unknown or inactive heating material: " ~ material)}
    {% endif %}
    {% set profile = config["material_" ~ matches[0] ~ "_heating"] %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(profile.nozzle)|float %}
    {% set bed_temp = params.BED_TEMP|default(profile.bed)|float %}
    _VALIDATE_MATERIAL_CONFIG WORKFLOW=heating
    SET_MATERIAL MATERIAL="{material}"
    M104 S{extruder_temp}
    M140 S{bed_temp}
    RESPOND PREFIX="info" MSG="Preheat {material}: {extruder_temp|int}/{bed_temp|int} C"


[gcode_macro LOAD_FILAMENT]
variable_load_distance: 125
gcode:
    {% set speed = params.SPEED|default(450) %}
    SAVE_GCODE_STATE NAME=load_state
    G91
    G92 E0
    G1 E{load_distance} F{speed}
    M400
    RESTORE_GCODE_STATE NAME=load_state
    {% if params.MATERIAL is defined %}
        SET_MATERIAL MATERIAL="{params.MATERIAL}"
    {% endif %}
    BEEP


[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance: 75
gcode:
    {% set speed = params.SPEED|default(450) %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    G92 E0
    G1 E-{unload_distance} F{speed}
    M400
    RESTORE_GCODE_STATE NAME=unload_state
    BEEP


[gcode_macro PURGE_FILAMENT]
variable_purge_distance: 25
gcode:
    {% set speed = params.SPEED|default(450) %}
    SAVE_GCODE_STATE NAME=purge_state
    G91
    G92 E0
    G1 E{purge_distance} F{speed}
    M400
    RESTORE_GCODE_STATE NAME=purge_state
    BEEP


[gcode_macro LOAD_MATERIAL]
description: Manual filament loading / change
variable_initial_target_temp: 0
gcode:
    {% set config = printer["gcode_macro _MATERIAL_CONFIG"] %}
    {% if config.heating_slots|length == 0 %}
        _LOAD_MATERIAL_EMPTY
    {% else %}
        _VALIDATE_MATERIAL_CONFIG WORKFLOW=heating
        SAVE_GCODE_STATE NAME=load_material_state
        SET_GCODE_VARIABLE MACRO=LOAD_MATERIAL VARIABLE=initial_target_temp VALUE={printer["extruder"].target}
        _LOAD_MATERIAL_SELECT
    {% endif %}


[gcode_macro _LOAD_MATERIAL_EMPTY]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Material Selection"
    RESPOND TYPE=command MSG="action:prompt_text No heating materials are enabled. Configure heating_slots and RESTART."
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_LOAD_MATERIAL_EMPTY_END"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _LOAD_MATERIAL_EMPTY_END]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro _LOAD_MATERIAL_SELECT]
gcode:
    {% set config = printer["gcode_macro _MATERIAL_CONFIG"] %}
    {% if printer["extruder"].target < printer.configfile.settings.extruder.min_extrude_temp %}
        RESPOND TYPE=command MSG="action:prompt_begin Material Selection"
        RESPOND TYPE=command MSG="action:prompt_text Select the material type to heat the nozzle."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% for slot in config.heating_slots %}
            {% set name = config["material_" ~ slot] %}
            {% set profile = config["material_" ~ slot ~ "_heating"] %}
            RESPOND TYPE=command MSG="action:prompt_button {name}|_LOAD_MATERIAL_HEATUP MATERIAL={name} TEMP={profile.nozzle}|primary"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_LOAD_MATERIAL_END"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={printer["extruder"].target}
        _LOAD_MATERIAL_ACTION
    {% endif %}


[gcode_macro _LOAD_MATERIAL_HEATUP]
gcode:
    {% set extruder_temp = params.TEMP|default(200)|float %}
    _VALIDATE_MATERIAL_CONFIG WORKFLOW=heating
    SET_MATERIAL MATERIAL="{params.MATERIAL}"
    RESPOND TYPE=command MSG="action:prompt_begin Material Selection"
    RESPOND TYPE=command MSG="action:prompt_text Heating up. Please wait..."
    RESPOND TYPE=command MSG="action:prompt_show"
    M104 S{extruder_temp}
    _WAIT_TEMPERATURE CMD=M104 VALUE={extruder_temp} BELOW=2 ABOVE=2
    BEEP
    _LOAD_MATERIAL_ACTION


[gcode_macro _LOAD_MATERIAL_ACTION]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Filament Loading"
    RESPOND TYPE=command MSG="action:prompt_text Select filament loading action."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Load|_FILAMENT_ACTION MACRO='LOAD_FILAMENT'|primary"
    RESPOND TYPE=command MSG="action:prompt_button Unload|_FILAMENT_ACTION MACRO='UNLOAD_FILAMENT'|primary"
    RESPOND TYPE=command MSG="action:prompt_button Purge|_FILAMENT_ACTION MACRO='PURGE_FILAMENT'|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Done|_LOAD_MATERIAL_END"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _FILAMENT_ACTION]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Filament change"
    RESPOND TYPE=command MSG="action:prompt_text Working with filament. Please wait..."
    RESPOND TYPE=command MSG="action:prompt_show"
    {% set macro_name = params.MACRO %}
    {macro_name}
    _LOAD_MATERIAL_ACTION


[gcode_macro _LOAD_MATERIAL_END]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    M104 S{printer["gcode_macro LOAD_MATERIAL"].initial_target_temp}
    RESTORE_GCODE_STATE NAME=load_material_state


[gcode_macro _COLDPULL_LOAD_MATERIAL_END]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro _COLDPULL_LOAD_MATERIAL]
gcode:
    {% set extruder_temp = params.TEMP|default(245)|float %}
    {% set cold_temp = params.COLD|default(100)|float %}
    {% if extruder_temp <= cold_temp
          or extruder_temp < printer.configfile.settings.extruder.min_extrude_temp
          or extruder_temp > printer.configfile.settings.extruder.max_temp
          or cold_temp < printer.configfile.settings.extruder.min_temp
          or cold_temp > printer.configfile.settings.extruder.max_temp %}
        {action_raise_error("Invalid cold-pull temperatures")}
    {% endif %}
    RESPOND TYPE=command MSG=action:prompt_end
    G28
    G90
    G1 X0 Y0 F7800
    M400
    RESPOND PREFIX="info" MSG="Waiting for the nozzle to heat up to {extruder_temp} degrees"
    M104 S{extruder_temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp} MAXIMUM={extruder_temp+10}
    RESPOND PREFIX="info" MSG="Extruding 10 cm of filament"
    G1 E100 F100
    M400
    RESPOND PREFIX="info" MSG="Cooling down to {cold_temp} degrees"
    M104 S{cold_temp}
    M106 P0 S255
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={cold_temp-2} MAXIMUM={cold_temp+2}
    BEEP
    RESPOND PREFIX="info" MSG="Pulling the filament back"
    G1 E-70 F1500
    M400
    RESPOND PREFIX="info" MSG="Manually remove the remaining filament"
    M107
    M104 S0


[gcode_macro COLDPULL]
description: Cold pull (nozzle cleaning) without violence.
gcode:
    {% set config = printer["gcode_macro _MATERIAL_CONFIG"] %}
    {% if config.cold_pull_slots|length == 0 %}
        RESPOND TYPE=command MSG="action:prompt_begin Cold Pull"
        RESPOND TYPE=command MSG="action:prompt_text No cold-pull materials are enabled. Configure cold_pull_slots and RESTART."
    {% else %}
        _VALIDATE_MATERIAL_CONFIG WORKFLOW=cold_pull
        RESPOND TYPE=command MSG="action:prompt_begin Select material for loading"
        RESPOND TYPE=command MSG="action:prompt_text Choose the material to clean the nozzle."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% for slot in config.cold_pull_slots %}
            {% set name = config["material_" ~ slot] %}
            {% set profile = config["material_" ~ slot ~ "_cold_pull"] %}
            RESPOND TYPE=command MSG="action:prompt_button {name}|_COLDPULL_LOAD_MATERIAL TEMP={profile.hot} COLD={profile.cold}|primary"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_COLDPULL_LOAD_MATERIAL_END"
    RESPOND TYPE=command MSG="action:prompt_show"
