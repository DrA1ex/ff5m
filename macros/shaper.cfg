[forge_shaper]
executable: /opt/config/mod/.bin/exec/forge-shaper
directory: /opt/config/mod_data/shaper
timeout: 180
keep_raw: False

[gcode_macro FORGE_SHAPER]
description: Calibrate shapers, stage recommendations, show results and generate PNG graphs
gcode:
    FORGE_SHAPER_CALIBRATE {rawparams}
    FORGE_SHAPER_APPLY SHAPER=auto
    FORGE_SHAPER_RESULTS PLOT=1

[gcode_macro FORGE_SHAPER_CALIBRATE]
description: Prepare and measure input shapers for review without applying settings or generating PNGs
gcode:
    {% if printer.print_stats.state|lower in ['printing', 'paused'] %}
        {action_raise_error("Shaper calibration is unavailable during a print")}
    {% endif %}
    
    _CONTEXT_BEGIN TYPE=input_shaper
    _CONTEXT_STATE NAME=PREPARING
    _ENSURE_SERVICES_STARTED
    _CANCEL_DELAYED_COMMANDS
    _HOME_IF_NEEDED
    _CONTEXT_STATE NAME=MEASURING
    _FORGE_SHAPER_MEASURE {rawparams}
    _CONTEXT_STATE NAME=COMPLETE
    _CONTEXT_END
