# Timelapse klipper macro definition
# Copied from Mainsail Crew's Moonraker Timelapse macros for Forge-X;
# corrected the FW_RETRACT conditional so Klipper can parse this file.
# Forge-X adds automatic capture intervals, parking at MOVE_SAFE limits, a
# per-print override, and guards for commands when timelapse is disabled.
# Internal delayed commands still finish park and render cleanup after disable.
#
# Copyright (C) 2021 Christoph Frei <fryakatkop@gmail.com>
# Copyright (C) 2021 Alex Zellner <alexander.zellner@googlemail.com>
# Copyright (C) 2026, Alexander K <https://github.com/drA1ex>
#
