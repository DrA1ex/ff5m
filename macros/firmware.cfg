[gcode_macro REMOVE_MOD]
description: Remove mod
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Question"
    RESPOND TYPE=command MSG="action:prompt_text Uninstalling the mod will remove all custom configurations and settings. If you plan to reinstall the mod later, consider using the REMOVE SOFT option to preserve root access and configurations. Select REMOVE to completely remove the mod."
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Remove soft|_TOUCH_BOOT_FLAG FLAG='REMOVE_MOD_SOFT'|error"
    RESPOND TYPE=command MSG="action:prompt_footer_button Remove|_TOUCH_BOOT_FLAG FLAG='REMOVE_MOD'|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro REMOVE_MOD_SOFT]
description: Remove mode, but leave root, audio, md5
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Question"
    RESPOND TYPE=command MSG="action:prompt_text Uninstalling the mod in soft mode will preserve the root, audio, and internal mod's configuration (in case you want to install it again). Select REMOVE SOFT to continue."
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Remove Soft|_TOUCH_BOOT_FLAG FLAG='REMOVE_MOD_SOFT'|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro SKIP_MOD]
description: Reboot into Stock Only mode
gcode:
    _TOUCH_BOOT_FLAG FLAG='SKIP_MOD'

[gcode_macro SKIP_MOD_SOFT]
description: Reboot into Stock + SSH mode
gcode:
    _TOUCH_BOOT_FLAG FLAG='SKIP_MOD_SOFT'

[gcode_macro _TOUCH_BOOT_FLAG]
gcode:
    {% set flag = params.FLAG|string %}
    RUN_SHELL_COMMAND CMD=ztouch PARAMS="/opt/config/mod/{flag}"
    RUN_SHELL_COMMAND CMD=sync
    RUN_SHELL_COMMAND CMD=reboot

[gcode_macro PREPARE_USB]
description: Inspect and prepare a USB drive for files or swap
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        {action_raise_error("USB preparation is unavailable while printing")}
    {% else %}
        RUN_SHELL_COMMAND CMD=zusb PARAMS="prompt"
    {% endif %}

[gcode_macro _PREPARE_USB_CONFIRM]
gcode:
    {% set format = params.FORMAT|upper %}
    {% set device = params.DEVICE|string %}
    {% set identity = params.ID|string %}
    RESPOND TYPE=command MSG=action:prompt_end
    RESPOND TYPE=command MSG="action:prompt_begin Confirm USB erase"
    RESPOND TYPE=command MSG="action:prompt_text ALL DATA on /dev/{device} will be permanently erased."
    RESPOND TYPE=command MSG="action:prompt_text The drive will be recreated as {format}. Verify the device and format before continuing."
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Erase and format|_PREPARE_USB_EXECUTE FORMAT={format} DEVICE={device} ID={identity}|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _PREPARE_USB_EXECUTE]
gcode:
    {% set format = params.FORMAT|upper %}
    {% set device = params.DEVICE|string %}
    {% set identity = params.ID|string %}
    RESPOND TYPE=command MSG=action:prompt_end
    RESPOND TYPE=command MSG="action:prompt_begin Preparing USB drive"
    RESPOND TYPE=command MSG="action:prompt_text Formatting /dev/{device} as {format}."
    RESPOND TYPE=command MSG="action:prompt_text Do not disconnect the drive or power off the printer. Progress is shown in the console."
    RESPOND TYPE=command MSG="action:prompt_show"
    RUN_SHELL_COMMAND CMD=zusb_format PARAMS="format {format} {device} {identity}"


[gcode_shell_command download_firmware_update]
command: bash
timeout: 1800
verbose: True
mode: background
linewise: True

[gcode_macro DOWNLOAD_FIRMWARE_UPDATE]
description: Download the latest full Forge-X firmware to a FAT32 USB drive
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        {action_raise_error("Firmware download is unavailable while printing")}
    {% else %}
        {% set model = params.MODEL|default("")|upper %}
        {% if model == "" %}
            RESPOND TYPE=command MSG=action:prompt_end
            RESPOND TYPE=command MSG="action:prompt_begin Select printer model"
            RESPOND TYPE=command MSG="action:prompt_text Select the printer model before downloading the firmware image."
            RESPOND TYPE=command MSG="action:prompt_footer_button Adventurer 5M|DOWNLOAD_FIRMWARE_UPDATE MODEL=5M|primary"
            RESPOND TYPE=command MSG="action:prompt_footer_button Adventurer 5M Pro|DOWNLOAD_FIRMWARE_UPDATE MODEL=PRO|primary"
            RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
            RESPOND TYPE=command MSG="action:prompt_show"
        {% elif model not in ["5M", "PRO"] %}
            {action_raise_error("MODEL must be 5M or PRO")}
        {% else %}
            RESPOND TYPE=command MSG=action:prompt_end
            RESPOND TYPE=command MSG="action:prompt_begin Checking firmware"
            RESPOND TYPE=command MSG="action:prompt_text Checking the latest Forge-X release and USB drive..."
            RESPOND TYPE=command MSG="action:prompt_show"
            RUN_SHELL_COMMAND CMD=zupdate PARAMS="{model}"
        {% endif %}
    {% endif %}

[gcode_macro FLASH_FIRMWARE]
description: Choose and install a stock, Forge-X or Recovery firmware image
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        {action_raise_error("Firmware flashing is unavailable while printing")}
    {% else %}
        {% set kind = params.TYPE|default("")|upper %}
        {% set version = params.VERSION|default("")|string %}
        {% set page = params.PAGE|default(1)|int %}
        {% if not kind %}
            RESPOND TYPE=command MSG="action:prompt_end"
            RESPOND TYPE=command MSG="action:prompt_begin Install firmware"
            RESPOND TYPE=command MSG="action:prompt_text Select the firmware type. The printer model will be detected automatically."
            RESPOND TYPE=command MSG="action:prompt_button_group_start"
            RESPOND TYPE=command MSG="action:prompt_button Stock firmware|FLASH_FIRMWARE TYPE=STOCK|primary"
            RESPOND TYPE=command MSG="action:prompt_button Forge-X|FLASH_FIRMWARE TYPE=FORGEX|primary"
            RESPOND TYPE=command MSG="action:prompt_button Recovery images|FLASH_FIRMWARE TYPE=RECOVERY|primary"
            RESPOND TYPE=command MSG="action:prompt_button_group_end"
            RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
            RESPOND TYPE=command MSG="action:prompt_show"
        {% elif kind not in ["STOCK", "FORGEX", "RECOVERY"] %}
            {action_raise_error("TYPE must be STOCK, FORGEX or RECOVERY")}
        {% elif not version %}
            RESPOND TYPE=command MSG="action:prompt_end"
            RESPOND TYPE=command MSG="action:prompt_begin Checking firmware"
            RESPOND TYPE=command MSG="action:prompt_text Loading available versions..."
            RESPOND TYPE=command MSG="action:prompt_show"
            RUN_SHELL_COMMAND CMD=zflash PARAMS="list {kind} {page}"
        {% elif params.CONFIRM|default(0)|int != 1 %}
            RESPOND TYPE=command MSG="action:prompt_end"
            RESPOND TYPE=command MSG="action:prompt_begin Confirm firmware installation"
            RESPOND TYPE=command MSG="action:prompt_text Install {kind} image {version}? It will be downloaded, verified and installed after reboot."
            RESPOND TYPE=command MSG="action:prompt_text Do not turn off the printer during installation."
            RESPOND TYPE=command MSG="action:prompt_footer_button Back|FLASH_FIRMWARE TYPE={kind}|secondary"
            RESPOND TYPE=command MSG="action:prompt_footer_button Install|FLASH_FIRMWARE TYPE={kind} VERSION={version} CONFIRM=1|error"
            RESPOND TYPE=command MSG="action:prompt_show"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_end"
            RESPOND TYPE=command MSG="action:prompt_begin Preparing firmware"
            RESPOND TYPE=command MSG="action:prompt_text Downloading and verifying {kind} {version}. The printer will reboot if successful."
            RESPOND TYPE=command MSG="action:prompt_show"
            RUN_SHELL_COMMAND CMD=zflash PARAMS="{kind} {version}"
        {% endif %}
    {% endif %}

[gcode_macro ENTER_RECOVERY]
description: Reboot into Forge-X Recovery without flashing firmware
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        {action_raise_error("Recovery is unavailable while printing")}
    {% else %}
        RUN_SHELL_COMMAND CMD=zrecovery
    {% endif %}
