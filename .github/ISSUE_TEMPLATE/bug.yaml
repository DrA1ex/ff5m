
name: Forge-X Bug Report
description: Report a bug in Forge-X
title: "[Bug]: "
labels: ["bug"]
assignees:
  - DrA1ex

body:
  - type: markdown
    attributes:
      value: |
        Report suspected Forge-X bugs here, including intermittent issues.
        For questions or uncertain problems, use [GitHub Discussions — Q&A](https://github.com/DrA1ex/ff5m/discussions/categories/q-a).
        Please check [existing issues](https://github.com/DrA1ex/ff5m/issues) first.

  - type: dropdown
    id: printer_model
    attributes:
      label: Printer Model
      options:
        - Adventurer 5M
        - Adventurer 5M Pro
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: Forge-X Version
      placeholder: "e.g., 1.4.2"

  - type: input
    id: firmware_version
    attributes:
      label: Firmware Version
      placeholder: "e.g., 3.1.5"

  - type: dropdown
    id: screen_type
    attributes:
      label: Screen Type
      options:
        - Stock screen
        - Feather
        - Guppy
        - Headless

  - type: dropdown
    id: skip_mod
    attributes:
      label: SKIP_MOD Test
      description: If possible, test without Forge-X using SKIP_MOD in Fluidd. Intermittent issues may require repeated testing.
      options:
        - Not tested
        - Problem persists without Forge-X
        - Problem disappears without Forge-X
        - Not applicable / Unable to test

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? Include reproduction steps, error messages, or expected behavior if known.
      placeholder: "Describe the problem..."
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Debug logs:** Run `TAR_DEBUG` in Fluidd, or collect `debug.tar` using a debug image:
        [5M](https://github.com/DrA1ex/ff5m/releases/download/1.2.0/Adventurer5M-debug.tgz) · [5M Pro](https://github.com/DrA1ex/ff5m/releases/download/1.2.0/Adventurer5MPro-debug.tgz).

  - type: textarea
    id: attachments
    attributes:
      label: Logs & Attachments
      description: Attach debug archives, installation logs, screenshots, or other useful information if available.
      placeholder: "Drag and drop files here..."
